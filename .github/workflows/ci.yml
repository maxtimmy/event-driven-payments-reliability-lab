name: reliability-lab-ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Static, Compose and count checks
        run: |
          python -m compileall -q src tests scripts
          docker compose config -q
          python scripts/check_test_count.py
      - name: Full test suite
        run: |
          mkdir -p test-results
          pytest -ra --cov=payments_lab --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results/junit.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results/
            coverage.xml
            htmlcov/
            pacts/
          if-no-files-found: warn

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start clean stack
        run: docker compose up -d --build --wait
      - name: Lifecycle and fault smoke
        run: python scripts/compose_smoke.py
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-failure.log
      - name: Upload Compose failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-failure-log
          path: compose-failure.log
      - name: Stop stack and delete volumes
        if: always()
        run: docker compose down -v --remove-orphans
