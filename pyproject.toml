[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-payments-reliability-lab"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13",
  "confluent-kafka>=2.5",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pact-python>=3.2,<4; python_version >= '3.10'",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
